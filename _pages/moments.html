<style>
  .mom-stream { margin: 0; }
  .mom { display: flex; gap: .9em; padding: 1.15em 0;
         border-bottom: 1px solid rgba(0, 0, 0, .07); }
  .mom:last-child { border-bottom: 0; }
  .mom__avatar { flex: 0 0 auto; }
  .mom__avatar img { display: block; width: 46px; height: 46px;
                     object-fit: cover; border-radius: 6px; }
  .mom__body { flex: 1 1 auto; min-width: 0; }
  .mom__name { font-weight: 600; font-size: .95em; margin-bottom: .3em; }
  .mom__text { font-size: .95em; line-height: 1.75; margin-bottom: .55em;
               white-space: pre-line; }
  .mom__grid { display: grid; gap: 4px; margin: 0 0 .55em; }
  .mom__grid--1 { grid-template-columns: 1fr; max-width: 200px; }
  .mom__grid--2 { grid-template-columns: repeat(2, 1fr); max-width: 280px; }
  .mom__grid--3 { grid-template-columns: repeat(3, 1fr); max-width: 340px; }
  .mom__grid a { display: block; cursor: zoom-in; }
  .mom__grid img { display: block; width: 100%; aspect-ratio: 1 / 1;
                   object-fit: cover; border-radius: 4px; transition: opacity .15s ease; }
  .mom__grid--1 img { aspect-ratio: auto; }
  .mom__grid a:hover img { opacity: .9; }
  .mom__meta { font-size: .8em; color: #9a9a9a; }

  .mom-lightbox { margin: auto; padding: 0; border: 0; background: transparent;
                  max-width: none; max-height: none; overflow: visible; }
  .mom-lightbox::backdrop { background: rgba(0, 0, 0, .88); }
  .mom-lightbox img { display: block; width: auto; height: auto;
                      max-width: 92vw; max-height: 92vh; border-radius: 6px;
                      box-shadow: 0 24px 70px rgba(0, 0, 0, .55); }
  .mom-lightbox__close { position: fixed; top: 12px; right: 16px;
                         width: 44px; height: 44px; padding: 0; border: 0;
                         border-radius: 50%; background: rgba(255,255,255,.14);
                         color: #fff; font-size: 26px; line-height: 1;
                         cursor: pointer; }
  .mom-lightbox__close:hover { background: rgba(255,255,255,.3); }

  html[data-theme="dark"] .mom { border-bottom-color: rgba(255,255,255,.12); }
  html[data-theme="dark"] .mom__meta { color: #8a8a8a; }
</style>

<script>
  (function () {
    var links = document.querySelectorAll('a.mom__zoom');
    if (!links.length || typeof HTMLDialogElement === 'undefined') return;

    var dlg = document.createElement('dialog');
    dlg.className = 'mom-lightbox';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mom-lightbox__close';
    btn.setAttribute('aria-label', '关闭');
    btn.textContent = '\u00d7';

    var img = document.createElement('img');
    img.alt = '';

    dlg.appendChild(btn);
    dlg.appendChild(img);
    document.body.appendChild(dlg);

    Array.prototype.forEach.call(links, function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        img.src = a.getAttribute('href');
        document.documentElement.style.overflow = 'hidden';
        dlg.showModal();
      });
    });

    dlg.addEventListener('click', function (e) {
      if (e.target === dlg) dlg.close();
    });
    btn.addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('close', function () {
      img.removeAttribute('src');
      document.documentElement.style.overflow = '';
    });
  })();
</script>
