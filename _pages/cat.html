<style>
  .cat-card { display: flex; gap: 1.6em; align-items: flex-start;
              padding: 1.4em; margin-bottom: 1.6em;
              border: 1px solid rgba(0,0,0,.08); border-radius: 12px;
              box-shadow: 0 2px 18px rgba(0,0,0,.05); }
  .cat-card__photo { flex: 0 0 180px; }
  .cat-card__photo img { display: block; width: 100%; height: auto;
                         border-radius: 8px; }
  .cat-card__info { flex: 1 1 auto; min-width: 0; padding-top: .2em; }
  .cat-row { display: flex; gap: 1.2em; padding: .42em 0;
             border-bottom: 1px dashed rgba(0,0,0,.07); }
  .cat-row:last-child { border-bottom: 0; }
  .cat-row__k { flex: 0 0 4.2em; color: #8a8a8a; font-size: .9em; }
  .cat-row__v { flex: 1 1 auto; font-weight: 500; }

  .cat-quote { margin: 0 0 2em; padding-left: .9em;
               border-left: 2px solid rgba(0,0,0,.14);
               color: #666; font-size: .95em; }

  .cat-h { margin: 2.2em 0 1em; padding-bottom: .35em; font-size: 1.05em;
           border-bottom: 2px solid rgba(0,0,0,.08); }

  .cat-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-gallery a { display: block; cursor: zoom-in; }
  .cat-gallery img { display: block; width: 100%; aspect-ratio: 1 / 1;
                     object-fit: cover; border-radius: 8px;
                     transition: opacity .15s ease; }
  .cat-gallery a:hover img { opacity: .9; }

  .cat-lightbox { margin: auto; padding: 0; border: 0; background: transparent;
                  max-width: none; max-height: none; overflow: visible; }
  .cat-lightbox::backdrop { background: rgba(0, 0, 0, .88); }
  .cat-lightbox img { display: block; width: auto; height: auto;
                      max-width: 92vw; max-height: 92vh; border-radius: 6px;
                      box-shadow: 0 24px 70px rgba(0, 0, 0, .55); }
  .cat-lightbox__close { position: fixed; top: 12px; right: 16px;
                         width: 44px; height: 44px; padding: 0; border: 0;
                         border-radius: 50%; background: rgba(255,255,255,.14);
                         color: #fff; font-size: 26px; line-height: 1;
                         cursor: pointer; }
  .cat-lightbox__close:hover { background: rgba(255,255,255,.3); }

  html[data-theme="dark"] .cat-card { border-color: rgba(255,255,255,.14); }
  html[data-theme="dark"] .cat-row { border-bottom-color: rgba(255,255,255,.12); }
  html[data-theme="dark"] .cat-row__k { color: #9a9a9a; }
  html[data-theme="dark"] .cat-quote { color: #b8b8b8;
                                       border-left-color: rgba(255,255,255,.22); }

  @media (max-width: 640px) {
    .cat-card { flex-direction: column; gap: 1em; }
    .cat-card__photo { flex: 0 0 auto; max-width: 200px; }
    .cat-gallery { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<script>
  (function () {
    var links = document.querySelectorAll('a.cat-zoom');
    if (!links.length || typeof HTMLDialogElement === 'undefined') return;

    var dlg = document.createElement('dialog');
    dlg.className = 'cat-lightbox';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-lightbox__close';
    btn.setAttribute('aria-label', '关闭');
    btn.textContent = '\u00d7';

    var img = document.createElement('img');
    img.alt = '';

    dlg.appendChild(btn);
    dlg.appendChild(img);
    document.body.appendChild(dlg);

    Array.prototype.forEach.call(links, function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        img.src = a.getAttribute('href');
        document.documentElement.style.overflow = 'hidden';
        dlg.showModal();
      });
    });

    dlg.addEventListener('click', function (e) {
      if (e.target === dlg) dlg.close();
    });
    btn.addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('close', function () {
      img.removeAttribute('src');
      document.documentElement.style.overflow = '';
    });
  })();
</script>
